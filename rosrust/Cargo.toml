[package]
edition = "2018"
authors = ["Adnan Ademovic <adnanademovic100@gmail.com>"]
description = "Pure Rust implementation of a ROS client library"
license = "MIT"
name = "rosrust"
readme = "../README.md"
repository = "https://github.com/adnanademovic/rosrust"
version = "0.9.11"

[dependencies]
byteorder = "1.4.3"
error-chain = "0.12.4"
lazy_static = "1.4.0"
log = "0.4.14"
regex = "1.5.4"
serde = "1.0.127"
serde_derive = "1.0.127"
yaml-rust = "0.4.5"
colored = "2.0.0"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
hostname = {version = "0.3.1"}
crossbeam = {version = "0.8.1"}
socket2 = {version = "0.4.1"}
xml-rpc = {path = "../../xml-rpc-rs"}
ctrlc = { version = "3.1.9", features = ["termination"]}
libc = {version = "0.2"}
timeout-readwrite = {version = "0.4.0"}
thread-priority = {version = "1.1.0"}

[dependencies.ros_message]
path = "../ros_message"
version = "0.1.1"

[dependencies.rosrust_codegen]
path = "../rosrust_codegen"
version = "0.9.6"

[dev-dependencies]
criterion = "0.3.5"
env_logger = "0.9.0"
nix = "0.26.2"
serde_json = "1.0.66"

[features]
derive-serde = ["rosrust_codegen/derive-serde"]
# std = ["hostname", "crossbeam", "socket2", "xml-rpc", "ctrlc", "libc", "timeout-readwrite", "thread-priority"]
# default = ["std"]

[[bench]]
name = "benchmarks"
harness = false
path = "tests/util/benchmarks.rs"
